name: Screenshots

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number: capture into that PR's branch (commits changed screenshots to it) instead of opening the refresh PR"
        required: false
        type: string
  # "/refresh-screenshots" commented on a PR captures into that PR's branch,
  # same as dispatching with its number. Gated to org members below.
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh
    runs-on: ubuntu-latest
    # A hung apt mirror once held the job for 20+ minutes; a healthy run takes
    # a few minutes, so time-box it and let the next schedule retry.
    timeout-minutes: 15
    # Comment-triggered runs only proceed for the keyword, on a PR, from
    # someone in the org - anyone can comment on a public repo.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '/refresh-screenshots') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    env:
      # The PR to capture into: the dispatch input, or the commented-on PR.
      # Empty means the weekly behavior (open/update the refresh PR).
      TARGET_PR: ${{ inputs.pr || github.event.issue.number || '' }}
    steps:
      # Working on a target PR's branch: capture from its annotations and push
      # the refreshed images back to it.
      - name: Resolve target branch
        id: target
        if: ${{ env.TARGET_PR != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "branch=$(gh pr view "$TARGET_PR" --repo '${{ github.repository }}' --json headRefName --jq .headRefName)" >> "$GITHUB_OUTPUT"
      - name: Clone repository
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ steps.target.outputs.branch || github.ref }}
      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.tool-versions'
      - name: Install JS Deps
        working-directory: _screenshots
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      # No browser install: the capture drives the runner's preinstalled
      # Chrome (SCREENSHOT_BROWSER_CHANNEL below).
      - name: Capture screenshots
        working-directory: _screenshots
        env:
          SCREENSHOT_BROWSER_CHANNEL: chrome
          SCREENSHOT_EMAIL: ${{ secrets.SCREENSHOT_EMAIL }}
          SCREENSHOT_PASSWORD: ${{ secrets.SCREENSHOT_PASSWORD }}
        run: node capture.js
      # Dispatched for a PR: commit refreshed images straight to its branch.
      # Fork PRs are not supported (the default token cannot push to forks).
      - name: Commit to the pull request
        if: ${{ env.TARGET_PR != '' && !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/files/*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Refresh app screenshots"
            git push
          fi
      # Runs even when a capture spec failed, so the shots that did refresh
      # still land in a PR while the red run flags the broken spec.
      - name: Create pull request
        if: ${{ env.TARGET_PR == '' && !cancelled() }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          # SCREENSHOT_PR_TOKEN (a PAT with contents + pull-requests write) when
          # present; PRs it opens trigger CI. The default token works only once
          # the repo allows Actions to create PRs (terraform-manage-repos), and
          # its PRs get no CI runs.
          token: ${{ secrets.SCREENSHOT_PR_TOKEN || github.token }}
          add-paths: content/files/*.png
          branch: refresh-app-screenshots
          delete-branch: true
          commit-message: Refresh app screenshots
          title: Refresh app screenshots
          body: |
            Weekly automated screenshot refresh from the app.

            Captured by `_screenshots/capture.js` from the `capture:` annotations
            in `content/articles/`, compressed with sharp. Only screenshots
            whose pixels meaningfully changed are included. Review each image
            before merging.
