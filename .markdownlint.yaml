# markdownlint config for the support site.
#
# Articles are kramdown-flavoured markdown compiled by nanoc, and the house
# conventions in .cursor/rules/ predate this file. Rules that contradict those
# conventions are turned off here with the reason recorded; everything else
# stays on so a new article still gets checked.

default: true

# Prose is never hard-wrapped: one paragraph is one line, so diffs stay
# readable and sentences move as units.
MD013: false

# Every article opens with an H1 followed by "### Table of Contents", which
# feeds kramdown's {:toc}. The jump from H1 to H3 is the required skeleton.
MD001: false

# The frontmatter `title` and the article's H1 are both mandatory and always
# say the same thing. Ignoring the frontmatter title leaves the rule catching
# what it should: a second H1 in the body.
MD025:
  front_matter_title: ""

# The kramdown TOC block is written "* TOC"; body bullets use "-". Both markers
# are load-bearing in the same file.
MD004: false

# Numbered steps interleave images and sub-lists at whatever indent reads best
# in the rendered page, and both "1. " and "1.  " are in use.
MD005: false
MD007: false
MD029: false
MD030: false
MD032: false

# "## Have more questions?" is boilerplate that runs straight into its
# paragraph with no blank line, in every article.
MD022: false

# Fenced blocks and callouts are written tight against surrounding prose.
MD031: false
MD028: false

# Trailing and repeated whitespace is invisible in the rendered page.
MD009: false
MD012: false

# Tabs are real content inside dig/zone-file output.
MD010:
  code_blocks: false

# HTML the articles rely on: video embeds, UI element names, and hand-built
# tables. Anything outside this list is markup that will not render.
MD033:
  allowed_elements:
    - a
    - acronym
    - br
    - code
    - div
    - em
    - iframe
    - img
    - kbd
    - label
    - pre
    - span
    - strong
    - sub
    - sup
    - table
    - tbody
    - td
    - th
    - thead
    - tr

# Terminal transcripts show the "$" prompt on purpose.
MD014: false

# Zone-file and dig output blocks have no language to tag.
MD040: false

# Articles name hostnames and email addresses as data ("www.example.com",
# "noreply@..."), which this rule cannot tell from a link.
MD034: false

# Bold lead-ins introduce error strings and short cases that are not sections
# and must stay out of the table of contents.
MD036: false

# FAQ sections use a question as the heading, and headings that introduce a
# list or an example end in a colon.
MD026:
  punctuation: ".,;"

# Sub-headings such as "Cost" repeat under different parents by design; a
# repeat under the same parent is still a mistake.
MD024:
  siblings_only: true

# Both fence and emphasis markers are mixed across the corpus and render
# identically.
MD048: false
MD049: false

# CLAUDE.md is generated and is a single "@AGENTS.md" include line. Articles
# take their title from frontmatter, so this rule never fires on them anyway.
MD041: false
